<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resonique 0.2.0 - physically modelled piano</title>
  <meta name="description" content="Resonique: a physically modelled acoustic piano that runs in the browser. The same engine as the VST3 plugin, compiled to WebAssembly.">
  <style>
/* ============================================================================
   Resonique: the family console (E-Piano / Eight Ball lineage) in piano
   colours: polished ebony chassis, ivory text, felt-red accent, brass readouts.
   ============================================================================ */
:root {
  --bg: #0b0a0c;
  --chassis-1: #1b181b;
  --chassis-2: #100f12;
  --panel: #17151a;
  --panel-edge: #2c272d;
  --screen: #080709;
  --text: #ece6dc;
  --ivory: #f1e9d8;
  --muted: #9a918a;
  --faint: #534c52;
  --accent: #d9544a;
  --accent-glow: rgba(217, 84, 74, 0.45);
  --accent-dim: #5a2621;
  --brass: #c9a35b;
  --track: #2e292f;
  --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "Cascadia Mono", "Consolas", ui-monospace, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh;
  background: radial-gradient(1400px 700px at 50% -10%, #1d191d 0%, var(--bg) 60%) var(--bg);
  color: var(--text);
  font-family: var(--sans);
  display: flex;
  justify-content: center;
  padding: 24px 16px;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; color: inherit; }

.synth {
  width: 100%;
  max-width: 1180px;
  background: linear-gradient(180deg, var(--chassis-1), var(--chassis-2));
  border: 1px solid var(--panel-edge);
  border-radius: 16px;
  padding: 16px 18px 14px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  display: flex;
  flex-direction: column;
  gap: 12px;
  user-select: none;
}

/* ---------------------------------------------------------------- LEDs --- */
.led {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #2b2220;
  box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.6);
  flex: none;
  transition: background 60ms, box-shadow 60ms;
}
.led.on, .selected > .led, .power.on .led {
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent-glow), 0 0 2px var(--accent);
}
.led.half { background: #8a3a33; }

.ctl-label, .panel-title, .knob-label, .pd-label, .vs-label {
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
}

/* -------------------------------------------------------------- top bar --- */
.topbar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-logo { width: 40px; height: 40px; }
.brand-text { display: flex; flex-direction: column; line-height: 1.1; }
.brand-mark { font-size: 21px; font-weight: 800; letter-spacing: 0.2em; color: var(--ivory); }
.brand-sub { font-size: 9.5px; letter-spacing: 0.22em; color: var(--accent); margin-top: 3px; }

.patch-display {
  flex: 1;
  min-width: 220px;
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--screen);
  border: 1px solid #000;
  border-radius: 6px;
  padding: 5px 6px;
  box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.8);
}
.pd-text { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; padding: 0 4px; }
.pd-name { font-family: var(--mono); color: var(--brass); font-size: 15px; text-shadow: 0 0 8px rgba(201, 163, 91, 0.35); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pd-step {
  flex: none; width: 26px; height: 26px; padding: 0;
  display: flex; align-items: center; justify-content: center;
  background: #15131a; border: 1px solid var(--panel-edge); border-radius: 5px; cursor: pointer;
}
.pd-step svg { width: 12px; height: 12px; fill: none; stroke: var(--muted); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.pd-step:hover svg { stroke: var(--accent); }
.pd-step:active { transform: translateY(1px); }
.pd-fav { flex: none; width: 26px; height: 26px; padding: 0; background: transparent; border: none; cursor: pointer; font-size: 16px; color: var(--faint); }
.pd-fav.on { color: var(--brass); text-shadow: 0 0 6px rgba(201, 163, 91, 0.6); }

.preset-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.pd-btn {
  background: linear-gradient(180deg, #25222a, #1a181e);
  border: 1px solid var(--panel-edge);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
  color: var(--text);
  cursor: pointer;
}
.pd-btn:hover { border-color: #3d3740; }
.pd-btn:active { transform: translateY(1px); }
.pd-btn.primary { background: linear-gradient(180deg, #3a2320, #2a1816); border-color: var(--accent-dim); color: #ff9c8a; }
.pd-btn.primary:hover { border-color: var(--accent); }
.pd-btn.danger { background: #2a1512; border-color: #5b2a22; color: #ff9c8a; }
.pd-btn.small { padding: 4px 8px; font-size: 10px; }
.pd-btn:disabled { opacity: 0.45; cursor: default; }

.top-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.indicator { display: flex; align-items: center; gap: 6px; font-size: 10px; letter-spacing: 0.14em; color: var(--muted); font-weight: 600; }
.panic {
  background: #2a1512; border: 1px solid #5b2a22; color: #ff9c8a;
  border-radius: 6px; padding: 6px 12px;
  font-size: 11px; letter-spacing: 0.14em; font-weight: 700; cursor: pointer;
}
.panic:hover { background: #3a1a15; }
.panic:active { transform: translateY(1px); }

/* ------------------------------------------------------- preset browser --- */
.browser {
  background: var(--panel);
  border: 1px solid var(--panel-edge);
  border-radius: 10px;
  padding: 8px;
  display: flex; flex-direction: column; gap: 8px;
}
.browser-head { display: flex; align-items: center; gap: 6px; }
.cat-tabs { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; }
.cat-tab {
  position: relative;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 5px;
  padding: 4px 9px;
  font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--muted);
  cursor: pointer;
}
.cat-tab:hover { color: var(--text); }
.cat-tab.active { color: var(--accent); border-color: var(--accent-dim); background: #221615; }
.cat-tab.has-current::after {
  content: ""; position: absolute; top: 3px; right: 3px;
  width: 4px; height: 4px; border-radius: 50%; background: var(--accent);
}
.cat-tab .count { color: var(--faint); margin-left: 4px; font-weight: 600; }
#preset-search {
  width: 190px;
  background: var(--screen); color: var(--text);
  border: 1px solid var(--panel-edge); border-radius: 5px;
  padding: 5px 8px; font: 12px var(--sans); outline: none;
  user-select: text;
}
#preset-search:focus { border-color: var(--accent-dim); }

.preset-grid {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  grid-auto-rows: 30px;
  gap: 6px;
  height: 66px;
  overflow-y: auto;
  padding-right: 2px;
}
.preset-btn {
  position: relative;
  display: flex; align-items: center;
  padding: 0 40px 0 10px;
  background: linear-gradient(180deg, #24212a, #1a181e);
  border: 1px solid var(--panel-edge);
  border-radius: 6px;
  font-size: 12px; font-weight: 600; text-align: left;
  cursor: pointer;
  min-width: 0;
}
.preset-btn:hover { border-color: #3d3740; }
.preset-btn:active { transform: translateY(1px); }
.preset-btn.selected { border-color: var(--accent); background: linear-gradient(180deg, #2e1f1d, #1f1716); color: var(--brass); }
.pb-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pb-fav, .pb-del {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 18px; height: 18px; line-height: 17px; text-align: center;
  border-radius: 4px; color: var(--faint); font-size: 14px;
}
.pb-fav { right: 22px; opacity: 0.45; }
.pb-fav.on { color: var(--brass); opacity: 1; }
.preset-btn:hover .pb-fav { opacity: 1; }
.pb-del { right: 4px; opacity: 0; }
.preset-btn:hover .pb-del { opacity: 1; }
.pb-del:hover { background: #3a1a15; color: #ff9c8a; }
.grid-empty { grid-column: 1 / -1; grid-row: 1 / 3; align-self: center; font-size: 12px; color: var(--muted); line-height: 1.6; padding: 0 4px; }
.path { font-family: var(--mono); color: var(--text); font-size: 11px; word-break: break-all; }
.preset-grid::-webkit-scrollbar { width: 6px; }
.preset-grid::-webkit-scrollbar-thumb { background: #33303a; border-radius: 3px; }
.preset-desc { font-size: 11px; color: var(--muted); min-height: 14px; padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ------------------------------------------------------------ page tabs --- */
.page-tabs {
  display: flex; align-items: center; gap: 4px;
  border-bottom: 1px solid var(--panel-edge);
  padding: 0 2px;
  margin-bottom: -6px;
}
.page-tab {
  display: flex; align-items: center; gap: 7px;
  background: transparent;
  border: 1px solid transparent; border-bottom: none;
  border-radius: 7px 7px 0 0;
  padding: 7px 14px 6px;
  font-size: 11px; font-weight: 700; letter-spacing: 0.16em;
  color: var(--muted);
  cursor: pointer;
  position: relative; top: 1px;
}
.page-tab:hover { color: var(--text); }
.page-tab.active { color: var(--accent); background: var(--panel); border-color: var(--panel-edge); }
.page-hint { margin-left: auto; font-size: 10px; color: var(--faint); letter-spacing: 0.04em; padding-right: 4px; }
.pages { display: grid; }
.page { grid-area: 1 / 1; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.page:not(.active) { visibility: hidden; pointer-events: none; }

/* --------------------------------------------------------------- panels --- */
.row { display: grid; gap: 12px; flex: 1; align-content: stretch; }
.row-main { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr) minmax(0, 1.15fr); }
.row-physics { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) minmax(0, 1fr); }
.col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.col > .panel { flex: 1; }
.row-mics { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1fr); }
.row-perf { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 0.9fr); }
.row-tuning { grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); }

.panel {
  background: var(--panel);
  border: 1px solid var(--panel-edge);
  border-radius: 10px;
  padding: 10px 12px 12px;
  display: flex; flex-direction: column; gap: 10px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
  min-width: 0;
}
.panel-head { display: flex; align-items: center; justify-content: space-between; min-height: 22px; gap: 8px; }
.panel-title { color: var(--ivory); }
.panel-note { font-size: 10px; color: var(--faint); line-height: 1.4; }
.panel.off .knob-row { opacity: 0.4; }

.power {
  display: flex; align-items: center; gap: 6px;
  background: #1f1c22; border: 1px solid var(--panel-edge); border-radius: 5px;
  padding: 3px 8px; font-size: 10px; letter-spacing: 0.14em; font-weight: 700;
  color: var(--muted); cursor: pointer;
}
.power.on { color: var(--text); }

.screen {
  position: relative;
  background: var(--screen);
  border: 1px solid #000;
  border-radius: 6px;
  height: 64px;
  overflow: hidden;
  box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.9);
}
.screen.tall { height: 120px; }
.screen svg { position: absolute; inset: 4px 0; width: 100%; height: calc(100% - 8px); }
.scr-grid { stroke: #1c1a20; stroke-width: 1; vector-effect: non-scaling-stroke; }
.scr-line { fill: none; stroke: var(--accent); stroke-width: 1.6; vector-effect: non-scaling-stroke; filter: drop-shadow(0 0 3px var(--accent-glow)); stroke-linejoin: round; }
.scr-line2 { fill: none; stroke: var(--brass); stroke-width: 1.2; vector-effect: non-scaling-stroke; opacity: 0.8; }
.scr-bar { fill: var(--accent); opacity: 0.85; }
.scr-bar.dim { fill: var(--faint); }
.scr-text {
  position: absolute; right: 8px; top: 5px;
  font-family: var(--mono); font-size: 10px; color: #cfc8bd;
  background: rgba(7, 8, 10, 0.75); padding: 1px 4px; border-radius: 3px;
}
.scr-text.left { right: auto; left: 8px; }

/* ---------------------------------------------------------------- knobs --- */
.knob-row { display: flex; justify-content: space-around; gap: 4px; flex-wrap: wrap; }
.knob { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 64px; }
.knob-svg { width: 56px; height: 56px; cursor: ns-resize; touch-action: none; outline: none; overflow: visible; }
.knob-svg:focus-visible .k-face { stroke: var(--accent); }
.k-track { fill: none; stroke: var(--track); stroke-width: 4; stroke-linecap: round; }
.k-value { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; filter: drop-shadow(0 0 3px var(--accent-glow)); }
.k-tick { fill: var(--faint); }
.k-face { fill: url(#knobFace); stroke: #050607; stroke-width: 1.5; }
.k-pointer { stroke: var(--ivory); stroke-width: 2.6; stroke-linecap: round; }
.knob:hover .k-track { stroke: #3a343b; }
.knob-value { font-family: var(--mono); font-size: 11px; color: var(--text); min-height: 14px; white-space: nowrap; }
.knob.active .knob-value { color: var(--accent); }
.knob-label { font-size: 9px; }
.knob.knob-lg { width: 76px; }
.knob.knob-lg .knob-svg { width: 68px; height: 68px; }

/* ---------------------------------------------------- instrument bank --- */
.instrument-bank { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.inst-btn {
  position: relative;
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
  padding: 7px 10px 8px;
  background: linear-gradient(180deg, #24212a, #1a181e);
  border: 1px solid var(--panel-edge);
  border-radius: 7px;
  cursor: pointer; text-align: left;
  box-shadow: 0 2px 0 #0b0c0e;
}
.inst-btn:hover { border-color: #3d3740; }
.inst-btn:active { transform: translateY(1px); box-shadow: 0 1px 0 #0b0c0e; }
.inst-btn .led { position: absolute; top: 9px; right: 9px; }
.inst-num { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.inst-name { font-size: 12px; font-weight: 600; line-height: 1.2; color: var(--ivory); }
.inst-btn.selected { border-color: var(--accent-dim); background: linear-gradient(180deg, #2e2220, #1e1717); }
.inst-btn.selected .inst-name { color: var(--brass); }

/* -------------------------------------------------------------- switches --- */
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
.labeled-row { display: grid; grid-template-columns: 74px minmax(0, 1fr); align-items: center; gap: 8px; }
.seg { display: inline-flex; background: #100f13; border: 1px solid var(--panel-edge); border-radius: 6px; padding: 2px; gap: 2px; flex-wrap: wrap; }
.seg button {
  background: transparent; border: none; border-radius: 4px;
  padding: 4px 8px;
  font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted); cursor: pointer;
}
.seg button:hover { color: var(--text); }
.seg button.on { background: #2e1f1d; color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent-dim); }
.seg button:focus-visible { outline: 1px solid var(--accent); }
.param-select {
  min-width: 0; width: 100%;
  background: var(--screen); color: var(--text);
  border: 1px solid var(--panel-edge); border-radius: 5px;
  padding: 4px 2px 4px 4px;
  font: 600 11px var(--sans); cursor: pointer;
}
.param-select:hover { border-color: #3d3740; }
.param-select:focus-visible { outline: 1px solid var(--accent); }

/* ------------------------------------------------------------- stats ------- */
.stat-screen { display: flex; flex-direction: column; justify-content: center; gap: 7px; padding: 0 10px; height: auto; min-height: 118px; }
.vs-row { display: flex; justify-content: space-between; align-items: baseline; }
.vs-value { font-family: var(--mono); color: var(--muted); font-size: 12px; }
.vs-value b { color: var(--brass); font-size: 15px; font-weight: 600; }
.meter { position: relative; height: 6px; background: #15131a; border-radius: 3px; overflow: hidden; }
.meter-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #3d8f5a 0%, #b8b23b 75%, #ff5a3d 100%); transition: width 60ms linear; }
.meter-clip { position: absolute; right: 0; top: 0; width: 6px; height: 100%; background: #3a1512; }
.meter-clip.on { background: #ff3b2f; box-shadow: 0 0 6px #ff3b2f; }
.cpu-fill { background: linear-gradient(90deg, #3a6f8f 0%, #b8b23b 70%, #ff5a3d 100%); }

/* --------------------------------------------------------------- keybed --- */
.keybed {
  display: flex; gap: 12px; align-items: stretch;
  background: #000; border: 1px solid #1d1a1e; border-radius: 12px; padding: 10px 12px;
  box-shadow: inset 0 4px 14px rgba(0, 0, 0, 0.9);
}
.pedals { display: flex; flex-direction: column; justify-content: center; gap: 6px; width: 92px; flex: none; }
.pedal-btn {
  display: flex; align-items: center; gap: 8px;
  background: #16141a; border: 1px solid #2c2730; border-radius: 6px;
  padding: 5px 8px; cursor: pointer;
}
.pedal-btn:hover { border-color: var(--accent-dim); }
.pedal-shoe { width: 14px; height: 22px; border-radius: 3px 3px 6px 6px; background: linear-gradient(180deg, #d8c290, #8c7a4a); box-shadow: 0 1px 0 #000; transition: transform 80ms; }
.pedal-btn.on .pedal-shoe { transform: translateY(2px) scaleY(0.82); background: linear-gradient(180deg, #ffe3a0, #b89a55); box-shadow: 0 0 8px rgba(201, 163, 91, 0.5); }
.pedal-btn.half .pedal-shoe { transform: translateY(1px) scaleY(0.92); }
.pedal-label { font-size: 9px; letter-spacing: 0.14em; color: var(--muted); font-weight: 700; }
.pedal-btn.on .pedal-label { color: var(--brass); }
.piano { flex: 1; min-width: 0; }
.piano-svg { display: block; width: 100%; height: auto; touch-action: none; cursor: pointer; }
/* octave buttons: phones only (compact layout) */
.octave-ctl { display: none; }
.oct-buttons { display: flex; gap: 6px; }
.oct-buttons button {
  width: 34px; height: 30px; padding: 0;
  background: #16141a; border: 1px solid #2c2730; border-radius: 6px;
  font-size: 16px; font-weight: 700; color: var(--ivory); cursor: pointer;
}
.oct-buttons button:hover { border-color: var(--accent-dim); }
.oct-buttons button:active { transform: translateY(1px); }
.oct-readout { font-family: var(--mono); font-size: 10px; color: var(--muted); white-space: nowrap; }
.felt { fill: #6a1f1a; }
.wkey { fill: #0d0c0e; stroke: #34303a; stroke-width: 1; transition: fill 40ms; }
.wkey:hover { fill: #18161a; }
.wkey.down { fill: var(--accent); stroke: var(--accent); }
.bkey { fill: #efe6d2; stroke: #8f8678; stroke-width: 1; transition: fill 40ms; }
.bkey:hover { fill: #fff8e8; }
.bkey.down { fill: var(--accent); stroke: #b85a20; }
.klabel { fill: #5b5660; font: 600 9px var(--sans); text-anchor: middle; pointer-events: none; }
.kbd-hint { font-size: 9px; color: var(--faint); line-height: 1.4; text-align: center; }

/* ----------------------------------------------------------- tuning editor --- */
.detune-editor { position: relative; height: 150px; background: var(--screen); border: 1px solid #000; border-radius: 6px; overflow: hidden; box-shadow: inset 0 2px 8px rgba(0,0,0,.9); }
.detune-editor svg { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: ns-resize; }
.dt-key { fill: #141217; stroke: #26232a; stroke-width: 0.5; }
.dt-key.black { fill: #1f1c23; }
.dt-bar { fill: var(--accent); opacity: 0.85; }
.dt-zero { stroke: #3a343b; stroke-width: 1; }
.dt-label { fill: var(--muted); font: 600 9px var(--mono); text-anchor: middle; pointer-events: none; }
.dt-readout { position: absolute; left: 8px; top: 5px; font: 10px var(--mono); color: #cfc8bd; background: rgba(7,8,10,.75); padding: 1px 4px; border-radius: 3px; pointer-events: none; }
.scala-status { font: 11px var(--mono); color: var(--muted); padding: 2px 0; }
.scala-status b { color: var(--brass); font-weight: 600; }

/* ----------------------------------------------------------- velocity editor --- */
.vel-editor svg { cursor: ns-resize; }
.vel-dot { fill: var(--ivory); stroke: var(--accent); stroke-width: 1.5; }

/* ---------------------------------------------------------- mic diagram --- */
.mic-svg .mic-piano { fill: #15131a; stroke: #3a343b; stroke-width: 1.2; }
.mic-svg .mic-board { fill: #2a1f1c; opacity: 0.6; }
.mic-svg .mic-bridge { stroke: var(--brass); stroke-width: 1.4; fill: none; }
.mic-svg .mic-dot { fill: var(--accent); }
.mic-svg .mic-cap { fill: none; stroke: var(--accent); stroke-width: 1; opacity: 0.6; }
.mic-svg .mic-ear { fill: var(--ivory); opacity: 0.8; }
.mic-svg text { fill: var(--muted); font: 600 9px var(--sans); text-anchor: middle; }

/* ------------------------------------------------------------ statusbar --- */
.statusbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-family: var(--mono); font-size: 11px; color: var(--muted); padding: 0 4px; }
.monitor { flex: 1; min-width: 0; white-space: pre; overflow: hidden; text-overflow: ellipsis; }
.audio-status { display: flex; align-items: center; gap: 6px; flex: none; }

/* ---------------------------------------------------------------- modal --- */
.modal { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(5, 6, 8, 0.7); }
.modal.hidden { display: none; }
.modal-card {
  width: min(440px, calc(100vw - 32px));
  background: linear-gradient(180deg, #1f1b22, #15131a);
  border: 1px solid var(--panel-edge); border-radius: 12px; padding: 18px;
  display: flex; flex-direction: column; gap: 12px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
}
.modal-title { font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ivory); }
.modal-body { font-size: 13px; color: var(--muted); line-height: 1.5; }
.modal-body b { color: var(--text); }
.modal-input {
  background: var(--screen); color: var(--brass);
  border: 1px solid var(--panel-edge); border-radius: 6px;
  padding: 9px 10px; font: 14px var(--mono); outline: none; user-select: text;
}
.modal-input:focus { border-color: var(--accent-dim); }
.modal-label { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-top: 4px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

/* ====================================================== plugin overrides === */
body.plugin { display: block; padding: 0; height: 100vh; overflow: hidden; background: var(--bg); }
body.plugin .synth {
  position: absolute; top: 10px; left: 50%;
  width: 1180px; max-width: none;
  transform-origin: top center;
  transform: translateX(-50%);
}

/* ====================================================== compact (phones) ===
   Touch screens too small for the scaled panel (app.js fit()): the panel is zoomed to
   the screen width, the page scrolls and the keyboard stays pinned to the bottom.
   Landscape: 900 px design width, panels two across. Portrait: one 480 px column. */
body.plugin.compact { height: 100vh; height: 100dvh; overflow-x: hidden; overflow-y: auto; overscroll-behavior: none; }
body.plugin.compact .synth {
  position: relative; top: auto; left: auto; transform: none;
  width: 900px; margin: 0 auto; padding: 10px 10px 0; gap: 10px;
  border-radius: 0; border-left: 0; border-right: 0; box-shadow: none;
}
body.plugin.compact .row { grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); }
body.plugin.compact .col { display: contents; }
body.plugin.compact .page:not(.active) { display: none; }
body.plugin.compact .page-tabs { overflow-x: auto; scrollbar-width: none; }
body.plugin.compact .page-tabs::-webkit-scrollbar { display: none; }
body.plugin.compact .page-hint, body.plugin.compact .kbd-hint, body.plugin.compact .brand-sub { display: none; }
body.plugin.compact .statusbar { padding-bottom: 4px; }
body.plugin.compact .knob-svg { cursor: default; }
/* the preset browser folds away (tap the preset name: app.js) */
body.plugin.compact:not(.browse-open) .browser { display: none; }
body.plugin.compact .pd-text { cursor: pointer; }
body.plugin.compact .pd-name::after { content: ' \25BE'; color: var(--muted); font-size: 0.8em; }
body.plugin.compact.browse-open .pd-name::after { content: ' \25B4'; }
body.plugin.compact .preset-grid { height: 132px; }
/* the keyboard: pinned to the bottom of the screen, with the octave buttons */
body.plugin.compact .keybed {
  position: sticky; bottom: 0; z-index: 3; margin: 0 -10px; border-radius: 10px 10px 0 0; padding: 8px 10px;
  box-shadow: inset 0 4px 14px rgba(0, 0, 0, 0.9), 0 -10px 24px rgba(0, 0, 0, 0.75);
}
body.plugin.compact .octave-ctl { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; width: 80px; flex: none; }
body.plugin.compact .pedals { width: 84px; }
body.plugin.compact .pedal-btn { padding: 5px 6px; }
/* landscape: short, wide keys so the panels above keep some room */
body.plugin.compact:not(.portrait) .piano-svg { height: 124px; }
body.plugin.compact:not(.portrait) .preset-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }

body.plugin.compact.portrait .knob { width: 58px; }
/* keyboard: pedals and octave buttons in a row on top of full-width keys */

  <script>
// ============================================================================
//  Parameter definitions. Must match vst/Source/dsp/ParamTable.h exactly (IDs,
//  names, kinds, ranges, defaults, units, log skew, choice lists, order).
//  tests/check-params.ps1 compares the two. New parameters are only appended.
// ============================================================================
'use strict';

const INSTRUMENTS = ['Concert Grand', 'Studio Grand', 'Upright', 'Vintage Upright', 'Bright Pop Grand',
                     'Dark Jazz Grand', 'Felt Piano', 'Prepared Piano', 'Honky-Tonk', 'Experimental Grand'];
const REVERB_TYPES = ['Room', 'Chamber', 'Hall', 'Stage', 'Impulse Response'];
const PERSPECTIVES = ['Player', 'Close Stereo', 'Concert Audience', 'Wide Stereo', 'Mono', 'Custom'];
const PEDAL_MODES = ['Continuous', 'Switch'];
const TEMPERAMENTS = ['Equal', 'Pythagorean', 'Just Intonation', 'Meantone 1/4', 'Werckmeister III',
                      'Kirnberger III', 'Vallotti', 'Young', 'Custom / Scala'];
const ROOTS = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const NUM_VOICES = 128;

const choiceParam = (id, name, group, choices, def) =>
  ({ id, name, group, type: 'choice', min: 0, max: choices.length - 1, step: 1, def, choices });
const f = (id, name, group, min, max, def, unit, extra) => Object.assign({ id, name, group, type: 'float', min, max, def, unit }, extra || {});
const intParam = (id, name, group, min, max, def, unit) => ({ id, name, group, type: 'int', min, max, def, unit, step: 1 });

const PARAM_DEFS = [
  // ---- main page
  choiceParam('instrument', 'Instrument', 'main', INSTRUMENTS, 0),
  f('master', 'Master', 'output', 0, 1, 0.8, '%', { noPreset: true }),
  f('toneBass', 'Bass', 'output', -12, 12, 0, 'dB', { bipolar: true }),
  f('toneTreble', 'Treble', 'output', -12, 12, 0, 'dB', { bipolar: true }),
  f('hammerHardness', 'Hardness', 'main', 0, 1, 0.5, '%'),
  f('dynamics', 'Dynamics', 'perf', 0, 1, 0.5, '%'),
  f('velCurve', 'Curve', 'perf', -1, 1, 0, 'bip', { bipolar: true }),
  f('stringResonance', 'Str. Reso', 'main', 0, 1, 0.5, '%'),
  f('soundboardResonance', 'Board Reso', 'main', 0, 1, 0.5, '%'),
  f('stereoWidth', 'Width', 'output', 0, 1, 0.7, '%'),
  f('reverbMix', 'Reverb', 'room', 0, 1, 0.18, '%'),
  f('reverbSize', 'Size', 'room', 0, 1, 0.5, '%'),
  f('reverbDamp', 'Damping', 'room', 0, 1, 0.5, '%'),
  choiceParam('reverbType', 'Type', 'room', REVERB_TYPES, 2),
  f('reverbPredelay', 'Predelay', 'room', 0, 100, 12, 'ms'),
  // ---- physical model page
  f('inharmonicity', 'Inharmonic.', 'strings', 0.25, 4, 1, 'x', { skew: 'log' }),
  f('stringStiffness', 'Stiffness', 'strings', 0.25, 4, 1, 'x', { skew: 'log' }),
  f('stringDecay', 'Decay', 'strings', 0.25, 4, 1, 'x', { skew: 'log' }),
  f('hammerPosition', 'Position', 'hammer', 0.5, 2, 1, 'x', { skew: 'log' }),
  f('hammerMass', 'Mass', 'hammer', 0.5, 2, 1, 'x', { skew: 'log' }),
  f('feltStiffness', 'Felt K', 'hammer', 0.25, 4, 1, 'x', { skew: 'log' }),
  f('feltExponent', 'Felt Exp.', 'hammer', -1, 1, 0, 'exp', { bipolar: true }),
  f('unisonDetune', 'Unison', 'strings', 0, 6, 1.0, 'ct'),
  f('damperEfficiency', 'Dampers', 'board', 0.25, 4, 1, 'x', { skew: 'log' }),
  f('bridgeCoupling', 'Bridge', 'strings', 0, 1, 0.5, '%'),
  f('soundboardSize', 'Board Size', 'board', 0.7, 1.4, 1, 'x', { skew: 'log' }),
  f('soundboardDamping', 'Board Damp', 'board', 0.3, 3, 1, 'x', { skew: 'log' }),
  f('soundboardBrightness', 'Brightness', 'board', -1, 1, 0, 'bip', { bipolar: true }),
  // ---- microphones
  choiceParam('micPerspective', 'Perspective', 'mics', PERSPECTIVES, 0),
  f('micDistance', 'Distance', 'mics', 0.3, 8, 1.2, 'm', { skew: 'log' }),
  f('micSpread', 'Spread', 'mics', 0, 1, 0.6, '%'),
  f('micPosition', 'Position', 'mics', -1, 1, 0, 'bip', { bipolar: true }),
  f('earlyReflections', 'Reflections', 'mics', 0, 1, 0.3, '%'),
  // ---- performance
  intParam('polyphony', 'Polyphony', 'perf', 8, 128, 64, ''),
  choiceParam('pedalMode', 'Pedal Mode', 'perf', PEDAL_MODES, 0),
  f('halfPedalPoint', 'Half Point', 'perf', 0.1, 0.9, 0.5, '%'),
  f('softPedalDepth', 'Soft Depth', 'perf', 0, 1, 0.6, '%'),
  intParam('pitchBendRange', 'Bend Range', 'perf', 0, 12, 2, 'st'),
  // ---- mechanical noises
  f('noiseHammer', 'Hammer', 'noise', 0, 1, 0.5, '%'),
  f('noiseKeyRelease', 'Release', 'noise', 0, 1, 0.4, '%'),
  f('noiseDamper', 'Damper', 'noise', 0, 1, 0.4, '%'),
  f('noisePedal', 'Pedal', 'noise', 0, 1, 0.4, '%'),
  f('noiseMaster', 'Amount', 'noise', 0, 1, 0.5, '%'),
  // ---- tuning
  choiceParam('temperament', 'Temperament', 'tuning', TEMPERAMENTS, 0),
  choiceParam('temperamentRoot', 'Root', 'tuning', ROOTS, 0),
  f('concertPitch', 'A4', 'tuning', 415, 466, 440, 'Hz'),
  f('stretch', 'Stretch', 'tuning', 0, 1, 0.6, '%'),
  // ---- level matching
  f('presetGain', 'Preset Gain', 'output', -24, 12, 0, 'dB', { bipolar: true }),
];

const PARAM_BY_ID = Object.fromEntries(PARAM_DEFS.map(d => [d.id, d]));

function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

function paramToNorm(def, v) {
  v = clamp(v, def.min, def.max);
  if (def.skew === 'log') return Math.log(v / def.min) / Math.log(def.max / def.min);
  return (v - def.min) / (def.max - def.min);
}
function paramFromNorm(def, n) {
  n = clamp(n, 0, 1);
  let v = def.skew === 'log' ? def.min * Math.pow(def.max / def.min, n) : def.min + (def.max - def.min) * n;
  if (def.step) v = Math.round(v / def.step) * def.step;
  return clamp(v, def.min, def.max);
}

function formatParam(def, v) {
  if (def.type === 'choice') return def.choices[clamp(Math.round(v), 0, def.choices.length - 1)];
  switch (def.unit) {
    case '%': return `${Math.round(v * 100)}%`;
    case 'bip': return `${v > 0.004 ? '+' : ''}${Math.round(v * 100)}%`;
    case 'dB': return `${v > 0.05 ? '+' : ''}${v.toFixed(1)} dB`;
    case 'Hz': return `${v.toFixed(1)} Hz`;
    case 'ct': return `${v.toFixed(2)} ct`;
    case 'st': return `${Math.round(v)} st`;
    case 'm': return `${v.toFixed(2)} m`;
    case 'ms': return `${Math.round(v)} ms`;
    case 'x': return `x${v.toFixed(2)}`;
    case 'exp': return `${v > 0.004 ? '+' : ''}${v.toFixed(2)}`;
    default: return def.type === 'int' ? String(Math.round(v)) : v.toFixed(2);
  }
}

function defaultParamValues() {
  const v = {};
  for (const d of PARAM_DEFS) v[d.id] = d.def;
  return v;
}

</script>

<script>
// ============================================================================
//  Web host: stands in for the plugin's C++ side when the UI runs in a
//  browser. It provides window.__JUCE__.backend with exactly the events the
//  JUCE editor uses (see PluginEditor.h), so vst/ui runs unchanged:
//    audio    the engine compiled to WebAssembly (RESONIQUE_WASM_B64, from
//             vst/Source via webhost/wasm-engine.cpp) in an AudioWorklet, or on
//             the main thread through a ScriptProcessor when opened from disk
//    tables   the note tables are built by a second engine instance on the
//             main thread and copied into the worklet (no stall on the audio thread)
//    MIDI     Web MIDI (all inputs or one): notes, sustain / sostenuto / soft,
//             pitch bend, all notes off
//    presets  factory (FACTORY_JSON, resolved like PresetManager), this browser
//             (localStorage), import / export of the same .rqpreset files as the VST
//    tuning   per-note detune and Scala files, like the plugin
// ============================================================================
(function () {
  'use strict';

  // Where the page runs: the Android app (android/, which injects window.AndroidMidi and
  // window.AndroidFiles before this script) or a browser. Query options:
  //   ?layout=portrait|landscape|desktop   force the phone layout (screenshots, tests)
  //   ?screenshot=<page>                   no start overlay, lively fake state, that page open
  //   ?selftest                            play a note and report (tests/run-web-check.ps1)
  const query = new URLSearchParams(location.search);
  const androidApp = !!window.AndroidMidi;
  if (query.get('layout')) window.__rqLayout = query.get('layout');
  const screenshotPage = query.get('screenshot');
  if (screenshotPage) { try { localStorage.setItem('resonique.page', screenshotPage); } catch (e) { /* ignore */ } }

  // ---------------------------------------------------------- the bridge ---
  const listeners = {};
  const handlers = {};
  const toUi = (ev, data) => queueMicrotask(() => (listeners[ev] || []).forEach(f => f(data)));
  window.__JUCE__ = {
    backend: {
      addEventListener(ev, fn) { (listeners[ev] = listeners[ev] || []).push(fn); },
      emitEvent(ev, data) { const h = handlers[ev]; if (h) h(data || {}); },   // synchronous: file pickers keep the click's activation
    },
  };
  const message = (text) => toUi('message', { text });
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  };
  const PARAM_INDEX = Object.fromEntries(PARAM_DEFS.map((d, i) => [d.id, i]));
  const TABLE_PARAMS = new Set(['instrument', 'hammerHardness', 'inharmonicity', 'stringStiffness', 'stringDecay', 'hammerPosition',
    'hammerMass', 'feltStiffness', 'feltExponent', 'unisonDetune', 'damperEfficiency', 'soundboardSize', 'soundboardDamping',
    'temperament', 'temperamentRoot', 'concertPitch', 'stretch']);   // mirrors paramAffectsTables() in ParamTable.h

  // ------------------------------------------------------- preset values ---
  // params may name a choice ("Upright") instead of its index, like the factory file does
  function readParams(block, into) {
    let found = 0;
    for (const id in (block || {})) {
      const d = PARAM_BY_ID[id];
      if (!d || d.noPreset) continue;
      let v = block[id];
      if (typeof v === 'string' && d.type === 'choice') { const i = d.choices.indexOf(v); if (i < 0) continue; v = i; }
      v = Number(v);
      if (isNaN(v)) continue;
      into[id] = clamp(v, d.min, d.max);
      found++;
    }
    return found;
  }
  const FACTORY = [];
  for (const cat of FACTORY_JSON.categories || []) {
    for (const p of cat.presets || []) {
      const values = {};
      readParams(p.params, values);
      FACTORY.push({ id: `factory:${FACTORY.length}`, name: p.name, category: cat.name, description: p.description || '', factory: true,
                     values, tuning: p.tuning || null });
    }
  }
  function loadUserPresets() { try { return JSON.parse(store.get('resonique.presets') || '[]'); } catch (e) { return []; } }
  function saveUserPresets(list) { store.set('resonique.presets', JSON.stringify(list)); }
  let favorites = new Set();
  try { favorites = new Set(JSON.parse(store.get('resonique.favorites') || '[]')); } catch (e) { /* ignore */ }

  // ---------------------------------------------------------------- state ---
  const values = defaultParamValues();
  let current = { id: '', name: '', category: '', description: '' };
  const tuning = { detune: new Array(88).fill(0), scala: '', scalaText: '', scalaNotes: 0 };

  // ------------------------------------------------------------- wasm ---
  function wasmBytes() {
    const bin = atob(RESONIQUE_WASM_B64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  // stub every import the module asks for (a standalone build asks for little or nothing)
  function wasmImports(module) {
    const imports = {};
    for (const imp of WebAssembly.Module.imports(module)) {
      imports[imp.module] = imports[imp.module] || {};
      if (imp.kind === 'function') imports[imp.module][imp.name] = (...a) => { if (imp.name === 'proc_exit') throw new Error('wasm exit'); return 0; };
      else if (imp.kind === 'memory') imports[imp.module][imp.name] = new WebAssembly.Memory({ initial: 1024 });
    }
    return imports;
  }
  // Engine: a thin JS wrapper around one instance's exports (shared by the main thread and the worklet)
  function makeEngine(instance, sampleRate) {
    const ex = instance.exports;
    if (ex._initialize) ex._initialize();   // once per instance (the exports object is frozen in browsers, so no marker on it)
    if (ex.rq_num_params() !== PARAM_DEFS.length) throw new Error(`parameter table mismatch: wasm ${ex.rq_num_params()} vs UI ${PARAM_DEFS.length}`);
    const ptr = ex.rq_create(sampleRate);
    const mem = () => ex.memory.buffer;
    const paramsPtr = ex.rq_params(ptr);
    const nParams = PARAM_DEFS.length;
    const floats = (p, n) => new Float32Array(mem(), p, n);
    const tableBytes = ex.rq_tables_bytes();
    const e = {
      ex, ptr, sampleRate, maxFrames: ex.rq_max_frames(), tableBytes,
      params() { return floats(paramsPtr, nParams); },
      apply() { ex.rq_apply_params(ptr); },
      render(frames) { ex.rq_render(ptr, frames); return [floats(ex.rq_out_l(ptr), frames), floats(ex.rq_out_r(ptr), frames)]; },
      noteOn(n, v) { ex.rq_note_on(ptr, n, v); }, noteOff(n) { ex.rq_note_off(ptr, n); },
      cc(c, v) { ex.rq_cc(ptr, c, v); }, bend(semis) { ex.rq_bend(ptr, semis); },
      allNotesOff() { ex.rq_all_notes_off(ptr); }, panic() { ex.rq_panic(ptr); },
      // tables: build here (main thread) and copy out, or copy in and adopt (worklet)
      buildTables() { const p = ex.rq_build_tables(ptr); return new Uint8Array(mem(), p, tableBytes).slice(); },
      adoptOwnBuild() { ex.rq_adopt_tables(ptr); },
      receiveTables(bytes) { new Uint8Array(mem(), ex.rq_table_target(ptr), tableBytes).set(bytes); ex.rq_adopt_tables(ptr); },
      // tuning state
      setDetune(i, c) { ex.rq_set_detune(ptr, i, c); }, resetDetune() { ex.rq_reset_detune(ptr); },
      setScala(text) {
        const bytes = new TextEncoder().encode(text + '\0');
        const p = ex.rq_alloc(bytes.length);
        new Uint8Array(mem(), p, bytes.length).set(bytes);
        const n = ex.rq_set_scala(ptr, p);
        ex.rq_free(p);
        return n;
      },
      clearScala() { ex.rq_clear_scala(ptr); },
      scalaDescription() {
        const p = ex.rq_scala_description(ptr);
        const b = new Uint8Array(mem(), p);
        let n = 0; while (b[n] !== 0 && n < 200) n++;
        return new TextDecoder().decode(b.subarray(0, n));
      },
      stats() {
        return { voices: ex.rq_active_voices(ptr), partials: ex.rq_active_partials(ptr), peak: ex.rq_take_peak(ptr), sustain: ex.rq_sustain(ptr),
                 sostenoto: false, sostenuto: !!ex.rq_sostenuto(ptr), soft: ex.rq_soft(ptr) };
      },
    };
    return e;
  }

  // the worklet: the same wrapper, driven by messages from the host
  function synthWorkletModule() {
    // makeEngine and wasmImports are pasted in below as source (functions cannot cross processorOptions)
    const makeEngine = new Function('PARAM_DEFS', 'clamp', `return (${'__MAKE_ENGINE__'});`)(PARAM_DEFS_IN_WORKLET, (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v));
    const wasmImports = new Function(`return (${'__WASM_IMPORTS__'});`)();
    class ResoniqueProcessor extends AudioWorkletProcessor {
      constructor(options) {
        super();
        const o = options.processorOptions;
        this.engine = null;
        this.pending = [];
        this.sinceStats = 0;
        this.port.onmessage = (e) => this.onMessage(e.data);
        WebAssembly.instantiate(o.module, wasmImports(o.module)).then((inst) => {
          this.engine = makeEngine(inst, sampleRate);
          this.engine.params().set(o.params);
          this.engine.apply();
          if (o.tables) this.engine.receiveTables(new Uint8Array(o.tables));
          for (const m of this.pending) this.onMessage(m);
          this.pending = [];
          this.port.postMessage({ type: 'ready' });
        }).catch((err) => this.port.postMessage({ type: 'error', error: String(err && err.message || err) }));
      }
      onMessage(m) {
        const e = this.engine;
        if (!e) { this.pending.push(m); return; }
        switch (m.type) {
          case 'param': e.params()[m.index] = m.value; break;
          case 'params': { const p = e.params(); for (const i in m.values) p[i] = m.values[i]; break; }
          case 'noteOn': e.noteOn(m.note, m.vel); break;
          case 'noteOff': e.noteOff(m.note); break;
          case 'cc': e.cc(m.cc, m.value); break;
          case 'bend': e.bend(m.value); break;
          case 'allNotesOff': e.allNotesOff(); break;
          case 'panic': e.panic(); break;
          case 'tables': e.receiveTables(new Uint8Array(m.data)); break;
          default: break;
        }
      }
      process(inputs, outputs) {
        const e = this.engine;
        const out = outputs[0];
        if (!e || !out || !out[0]) return true;
        const frames = out[0].length;
        e.apply();
        const [L, R] = e.render(frames);
        out[0].set(L);
        if (out[1]) out[1].set(R);
        this.sinceStats += frames;
        if (this.sinceStats >= sampleRate / 30) {
          this.sinceStats = 0;
          const s = e.stats();
          s.type = 'stats';
          this.port.postMessage(s);
        }
        return true;
      }
    }
    registerProcessor('resonique-piano', ResoniqueProcessor);
  }

  // --------------------------------------------------------------- audio ---
  const audio = {
    ctx: null, node: null, port: null, mode: '', error: '', module: null, main: null, ready: false,
    post(m, transfer) { if (this.port) this.port.postMessage(m, transfer || []); },
    get running() { return !!this.ctx && this.ctx.state === 'running' && this.ready; },

    async init(sampleRate) {
      this.module = await WebAssembly.compile(wasmBytes());
      // the main-thread instance: builds the tables; also the fallback sound engine
      const inst = await WebAssembly.instantiate(this.module, wasmImports(this.module));
      this.main = makeEngine(inst, sampleRate);
      this.main.params().set(PARAM_DEFS.map(d => values[d.id]));
      this.main.apply();
      pushTuning(this.main);
    },

    async start() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
      this.ctx = ctx;
      await this.init(ctx.sampleRate);
      ctx.onstatechange = sendConfig;
      let built = null;
      if (ctx.audioWorklet && location.protocol !== 'file:') {
        try {
          const src = `const PARAM_DEFS_IN_WORKLET = ${JSON.stringify(PARAM_DEFS.map(d => ({ id: d.id })))};\n(${synthWorkletModule.toString().replace("'__MAKE_ENGINE__'", JSON.stringify(makeEngine.toString())).replace("'__WASM_IMPORTS__'", JSON.stringify(wasmImports.toString()))})();`;
          const url = URL.createObjectURL(new Blob([src], { type: 'application/javascript' }));
          try { await ctx.audioWorklet.addModule(url); } finally { URL.revokeObjectURL(url); }
          const tables = this.main.buildTables();
          this.main.adoptOwnBuild();
          const node = new AudioWorkletNode(ctx, 'resonique-piano', {
            numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2],
            processorOptions: { module: this.module, params: PARAM_DEFS.map(d => values[d.id]), tables: tables.buffer },
          });
          node.port.onmessage = (e) => onDspMessage(e.data);
          built = { node, port: node.port, mode: 'AudioWorklet' };
        } catch (e) { console.warn('AudioWorklet unavailable, using the main thread', e); }
      }
      if (!built) built = this.scriptProcessor(ctx);
      this.node = built.node; this.port = built.port; this.mode = built.mode;
      this.node.connect(ctx.destination);
      sendConfig();
    },

    // Chrome / Edge block worklet modules on file://: run the main-thread engine through a ScriptProcessor
    scriptProcessor(ctx) {
      const main = this.main;
      let since = 0;
      const node = ctx.createScriptProcessor(1024, 0, 2);
      node.onaudioprocess = (ev) => {
        const L = ev.outputBuffer.getChannelData(0), R = ev.outputBuffer.getChannelData(1);
        for (let off = 0; off < L.length; off += 128) {
          main.apply();
          const [l, r] = main.render(128);
          L.set(l, off); R.set(r, off);
        }
        since += L.length;
        if (since >= ctx.sampleRate / 30) { since = 0; const s = main.stats(); s.type = 'stats'; onDspMessage(s); }
      };
      const port = { postMessage: (m) => {
        switch (m.type) {
          case 'param': main.params()[m.index] = m.value; break;
          case 'params': { const p = main.params(); for (const i in m.values) p[i] = m.values[i]; break; }
          case 'noteOn': main.noteOn(m.note, m.vel); break;
          case 'noteOff': main.noteOff(m.note); break;
          case 'cc': main.cc(m.cc, m.value); break;
          case 'bend': main.bend(m.value); break;
          case 'allNotesOff': main.allNotesOff(); break;
          case 'panic': main.panic(); break;
          case 'tables': break;   // the main instance adopted its own build already
          default: break;
        }
      } };
      this.ready = true;
      return { node, port, mode: 'ScriptProcessor' };
    },
  };

  let building = false;
  function onDspMessage(m) {
    if (m.type === 'ready') { audio.ready = true; sendConfig(); return; }
    if (m.type === 'error') { audio.error = m.error; message(`Audio engine error: ${m.error}`); sendConfig(); return; }
    if (m.type === 'stats') {
      toUi('stats', { voices: m.voices, partials: m.partials, peak: m.peak, sustain: m.sustain, sostenuto: m.sostenuto, soft: m.soft,
                      cpu: 0, building, sampleRate: audio.ctx ? audio.ctx.sampleRate : 0 });
    }
  }

  // ---- note tables: rebuilt on the main thread when a physical parameter or the tuning changes ----
  let rebuildTimer = 0;
  function scheduleRebuild() {
    if (!audio.main) return;
    building = true;
    clearTimeout(rebuildTimer);
    rebuildTimer = setTimeout(() => {
      rebuildTimer = 0;
      const main = audio.main;
      main.params().set(PARAM_DEFS.map(d => values[d.id]));
      const bytes = main.buildTables();
      if (audio.mode === 'AudioWorklet') audio.post({ type: 'tables', data: bytes.buffer }, [bytes.buffer]);
      main.adoptOwnBuild();
      building = false;
    }, 60);
  }
  function pushTuning(engine) {
    engine.resetDetune();
    tuning.detune.forEach((c, i) => { if (c) engine.setDetune(i, c); });
    if (tuning.scalaText) { tuning.scalaNotes = engine.setScala(tuning.scalaText); tuning.scala = engine.scalaDescription(); }
    else engine.clearScala();
  }
  function sendTuning() { toUi('tuning', { detune: tuning.detune.slice(), scala: tuning.scala, scalaNotes: tuning.scalaNotes, valid: tuning.scalaNotes > 0 }); }

  // ------------------------------------------------------------ parameters ---
  function setParamValue(id, v, fromPreset) {
    const d = PARAM_BY_ID[id];
    if (!d) return;
    v = clamp(Number(v), d.min, d.max);
    values[id] = v;
    audio.post({ type: 'param', index: PARAM_INDEX[id], value: v });
    if (TABLE_PARAMS.has(id)) scheduleRebuild();
  }
  handlers.setParam = ({ id, value }) => setParamValue(id, value);
  handlers.setParams = ({ values: obj }) => { for (const id in obj) setParamValue(id, obj[id]); };
  handlers.gesture = () => {};
  handlers.paramMenu = ({ id }) => { const d = PARAM_BY_ID[id]; if (d) { setParamValue(id, d.def); toUi('params', { [id]: d.def }); } };

  // --------------------------------------------------------------- notes ---
  handlers.noteOn = ({ note, vel }) => { audio.post({ type: 'noteOn', note, vel }); toUi('notes', { on: [note], off: [] }); };
  handlers.noteOff = ({ note }) => { audio.post({ type: 'noteOff', note }); toUi('notes', { on: [], off: [note] }); };
  handlers.panic = () => { audio.post({ type: 'panic' }); };
  handlers.pedal = ({ cc, value }) => audio.post({ type: 'cc', cc, value });

  // ------------------------------------------------------------- presets ---
  function sendPresetList() {
    const user = loadUserPresets().map(p => ({ id: p.id, name: p.name, category: p.category || 'User', description: p.description || '', factory: false }));
    toUi('presetList', { presets: FACTORY.map(p => ({ id: p.id, name: p.name, category: p.category, description: p.description, factory: true })).concat(user),
                         folder: 'this browser (localStorage)', favorites: Array.from(favorites) });
  }
  function sendPreset() { toUi('preset', current); }
  function applyValues(vals, tuningBlock) {
    const changed = {};
    for (const d of PARAM_DEFS) {
      if (d.noPreset) continue;
      const v = vals[d.id] !== undefined ? vals[d.id] : d.def;
      values[d.id] = v; changed[d.id] = v;
    }
    audio.post({ type: 'params', values: Object.fromEntries(PARAM_DEFS.map((d, i) => [i, values[d.id]])) });
    tuning.detune = new Array(88).fill(0);
    tuning.scalaText = ''; tuning.scala = ''; tuning.scalaNotes = 0;
    if (tuningBlock && typeof tuningBlock === 'object') {
      if (Array.isArray(tuningBlock.detune)) tuningBlock.detune.slice(0, 88).forEach((c, i) => { tuning.detune[i] = clamp(Number(c) || 0, -100, 100); });
      if (typeof tuningBlock.scala === 'string' && tuningBlock.scala) tuning.scalaText = tuningBlock.scala;
    }
    if (audio.main) pushTuning(audio.main);
    toUi('params', changed);
    sendTuning();
    scheduleRebuild();
  }
  function loadById(id) {
    const f = FACTORY.find(p => p.id === id);
    if (f) { applyValues(f.values, f.tuning); current = { id: f.id, name: f.name, category: f.category, description: f.description }; sendPreset(); return true; }
    const u = loadUserPresets().find(p => p.id === id);
    if (u) { applyValues(u.params || {}, u.tuning); current = { id: u.id, name: u.name, category: u.category || 'User', description: u.description || '' }; sendPreset(); return true; }
    message('Preset not found');
    return false;
  }
  handlers.loadPreset = ({ id }) => loadById(id);
  function presetJson(name, category) {
    const params = {};
    for (const d of PARAM_DEFS) if (!d.noPreset) params[d.id] = Math.round(values[d.id] * 1e6) / 1e6;
    const t = {};
    if (tuning.detune.some(c => c)) t.detune = tuning.detune.slice();
    if (tuning.scalaText) t.scala = tuning.scalaText;
    const j = { format: 'Resonique Preset', version: 1, name, category: category || 'User', params };
    if (Object.keys(t).length) j.tuning = t;
    return j;
  }
  handlers.savePreset = ({ name, category, overwrite }) => {
    name = (name || '').trim();
    if (!name) { toUi('saveResult', { ok: false, exists: false, name, error: 'Enter a name for the preset' }); return; }
    const list = loadUserPresets();
    const id = `user:${name}`;
    const existing = list.findIndex(p => p.id === id);
    if (existing >= 0 && !overwrite) { toUi('saveResult', { ok: false, exists: true, name, error: '' }); return; }
    const j = presetJson(name, (category || '').trim() || 'User');
    const entry = { id, name, category: j.category, params: j.params, tuning: j.tuning || null };
    if (existing >= 0) list[existing] = entry; else list.push(entry);
    saveUserPresets(list);
    current = { id, name, category: j.category, description: '' };
    toUi('saveResult', { ok: true, exists: false, name, error: '' });
    sendPresetList(); sendPreset();
  };
  handlers.deletePreset = ({ id }) => {
    const list = loadUserPresets();
    const i = list.findIndex(p => p.id === id);
    if (i < 0) { message('Only user presets can be deleted'); return; }
    list.splice(i, 1); saveUserPresets(list);
    favorites.delete(id); store.set('resonique.favorites', JSON.stringify(Array.from(favorites)));
    if (current.id === id) { current = { id: '', name: current.name, category: 'User', description: '' }; sendPreset(); }
    message('Preset deleted');
    sendPresetList();
  };
  handlers.setFavourite = ({ id, on }) => { if (on) favorites.add(id); else favorites.delete(id); store.set('resonique.favorites', JSON.stringify(Array.from(favorites))); sendPresetList(); };
  handlers.initPreset = () => { applyValues({}, null); current = { id: '', name: 'Init', category: 'User', description: 'Every parameter at its default' }; sendPreset(); };
  handlers.factoryReset = () => { favorites = new Set(); store.set('resonique.favorites', '[]'); loadById('factory:0'); message('Factory defaults restored (your saved presets are untouched)'); sendPresetList(); };
  handlers.openPresetFolder = () => message(androidApp
    ? 'SAVE keeps presets in the app (they are part of your phone backup); EXPORT writes a .rqpreset file, IMPORT opens one from your phone or a cloud drive.'
    : 'Presets are stored in this browser. Use EXPORT to write a .rqpreset file.');
  // import / export: the same .rqpreset files as the plugin
  function pickFile(accept, onText) {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = accept; input.style.display = 'none';
    input.addEventListener('change', () => {
      const f = input.files && input.files[0];
      if (f) f.text().then(t => onText(t, f.name)).catch(err => message(String(err)));
      input.remove();
    });
    document.body.appendChild(input);
    input.click();
  }
  handlers.loadPresetFile = () => pickFile('.rqpreset,application/json', (text, fileName) => {
    let j;
    try { j = JSON.parse(text); } catch (e) { message(`Not a valid preset file: ${fileName}`); return; }
    const vals = {};
    if (!j || typeof j !== 'object' || readParams(j.params, vals) === 0) { message(`No Resonique settings found in ${fileName}`); return; }
    applyValues(vals, j.tuning);
    current = { id: `file:${fileName}`, name: j.name || fileName.replace(/\.rqpreset$/i, ''), category: 'File', description: j.description || '' };
    sendPreset();
    message(`Loaded ${fileName}`);
  });
  handlers.exportPreset = () => {
    const name = current.name && current.name !== '—' ? current.name : 'Resonique preset';
    const j = presetJson(name, current.category || 'User');
    const text = JSON.stringify(j, null, 1);
    const fileName = `${name.replace(/[\\/:*?"<>|]+/g, '_')}.rqpreset`;
    if (window.AndroidFiles) {   // the Android app: a "save as" dialog (WebView cannot download a blob)
      window.AndroidFiles.saveTextFile(fileName, 'application/json', text);
      return;
    }
    const blob = new Blob([text], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fileName;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    message(`Exported ${a.download}`);
  };

  // -------------------------------------------------------------- tuning ---
  handlers.setDetune = ({ note, cents }) => {
    if (note < 0 || note >= 88) return;
    tuning.detune[note] = clamp(Number(cents) || 0, -100, 100);
    if (audio.main) audio.main.setDetune(note, tuning.detune[note]);
    scheduleRebuild();
  };
  handlers.resetDetune = () => { tuning.detune = new Array(88).fill(0); if (audio.main) audio.main.resetDetune(); sendTuning(); scheduleRebuild(); };
  handlers.loadScala = () => pickFile('.scl,text/plain', (text, fileName) => {
    if (!audio.main) { message('Start the audio first'); return; }
    const n = audio.main.setScala(text);
    if (!n) { message(`Scala: cannot read ${fileName}`); return; }
    tuning.scalaText = text; tuning.scalaNotes = n; tuning.scala = audio.main.scalaDescription() || fileName;
    setParamValue('temperament', TEMPERAMENTS.length - 1);
    toUi('params', { temperament: TEMPERAMENTS.length - 1 });
    sendTuning(); scheduleRebuild();
    message(`Loaded scale ${fileName}`);
  });
  handlers.clearScala = () => { tuning.scalaText = ''; tuning.scala = ''; tuning.scalaNotes = 0; if (audio.main) audio.main.clearScala(); sendTuning(); scheduleRebuild(); };
  handlers.loadIR = () => message('Impulse-response reverb is not available in the browser build; the algorithmic rooms are.');
  handlers.clearIR = () => {};

  // ---------------------------------------------------------------- MIDI ---
  const midi = { access: null, selected: store.get('resonique.midi') || 'all', inputs: [] };
  function onMidi(ev) {
    const [status, d1, d2] = ev.data;
    const type = status & 0xf0;
    if (type === 0x90 && d2 > 0) handlers.noteOn({ note: d1, vel: d2 });
    else if (type === 0x80 || (type === 0x90 && d2 === 0)) handlers.noteOff({ note: d1 });
    else if (type === 0xb0) {
      if (d1 === 64 || d1 === 66 || d1 === 67) audio.post({ type: 'cc', cc: d1, value: d2 });
      else if (d1 === 120) audio.post({ type: 'panic' });
      else if (d1 === 123 || d1 === 121) audio.post({ type: 'allNotesOff' });
    } else if (type === 0xe0) {
      const v = ((d2 << 7) | d1) - 8192;
      audio.post({ type: 'bend', value: v / 8192 * values.pitchBendRange });
    }
  }
  function bindMidi() {
    if (!midi.access) return;
    midi.inputs = Array.from(midi.access.inputs.values());
    for (const inp of midi.inputs) inp.onmidimessage = (midi.selected === 'all' || midi.selected === inp.id) ? onMidi : null;
    renderMidiSelect();
  }
  let midiSelect = null;
  function renderMidiSelect() {
    if (!midiSelect) return;
    midiSelect.innerHTML = '';
    if (!midi.access) { midiSelect.appendChild(new Option('MIDI unavailable', 'all')); midiSelect.disabled = true; return; }
    midiSelect.disabled = false;
    midiSelect.appendChild(new Option(midi.inputs.length ? `All inputs (${midi.inputs.length})` : 'No MIDI devices', 'all'));
    midi.inputs.forEach(d => midiSelect.appendChild(new Option(d.name + (d.state === 'connected' ? '' : ' (off)'), d.id)));
    midiSelect.value = Array.from(midiSelect.options).some(o => o.value === midi.selected) ? midi.selected : 'all';
  }
  if (typeof navigator.requestMIDIAccess === 'function') {
    navigator.requestMIDIAccess({ sysex: false }).then((access) => {
      midi.access = access;
      access.onstatechange = bindMidi;
      bindMidi();
    }).catch(() => renderMidiSelect());
  }

  // ------------------------------------------------------- page additions ---
  // a MIDI input picker in the top bar and the start-audio overlay (browsers need a gesture)
  function addPageBits() {
    const controls = document.querySelector('.top-controls');
    if (controls) {
      const label = document.createElement('label');
      label.className = 'indicator';
      label.innerHTML = 'MIDI IN <select id="midi-select" style="margin-left:6px;max-width:170px;background:var(--screen);color:var(--text);border:1px solid var(--panel-edge);border-radius:5px;padding:3px 6px;font:11px var(--sans)"></select>';
      controls.insertBefore(label, controls.firstChild);
      midiSelect = label.querySelector('select');
      midiSelect.addEventListener('change', () => { midi.selected = midiSelect.value; store.set('resonique.midi', midi.selected); bindMidi(); });
      midiSelect.addEventListener('keydown', (e) => e.stopPropagation());
      renderMidiSelect();
    }
    const style = document.createElement('style');
    style.textContent = `
      .rq-overlay { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; background: rgba(5,6,8,.78); backdrop-filter: blur(4px); }
      .rq-overlay.hidden { display: none; }
      .rq-card { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 16px; color: var(--text); font-family: var(--sans); }
      .rq-power { width: 96px; height: 96px; border-radius: 50%; background: radial-gradient(circle at 40% 30%, #2e2a30, #15131a); border: 2px solid var(--accent-dim); color: var(--accent); display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 30px rgba(217,84,74,.15); }
      .rq-power:hover { border-color: var(--accent); box-shadow: 0 0 40px var(--accent-glow); }
      .rq-power:disabled { opacity: .5; cursor: wait; }
      .rq-title { margin: 10px 0 0; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; font-size: 13px; }
      .rq-sub { margin: 0; color: var(--muted); font-size: 13px; max-width: 340px; line-height: 1.5; }`;
    document.head.appendChild(style);
    const overlay = document.createElement('div');
    overlay.className = 'rq-overlay';
    overlay.innerHTML = `<div class="rq-card"><button class="rq-power" type="button" aria-label="Start audio"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></svg></button><p class="rq-title">Resonique</p><p class="rq-sub">A physically modelled piano running in your browser. Click to start the audio, then play with a MIDI keyboard, the keys, or A–' on the computer keyboard.</p></div>`;
    document.body.appendChild(overlay);
    const btn = overlay.querySelector('button');
    const start = async () => {
      btn.disabled = true;
      try { await audio.start(); overlay.classList.add('hidden'); }
      catch (e) { console.error(e); overlay.classList.remove('hidden'); overlay.querySelector('.rq-sub').textContent = `Could not start the audio: ${e && e.message ? e.message : e}`; btn.disabled = false; }
    };
    btn.addEventListener('click', start);

    if (androidApp || screenshotPage) overlay.classList.add('hidden');
    if (androidApp) start();
  }

  // The Android app calls these when it leaves / returns to the screen: no hanging notes, no
  // audio running in the background.
  window.__rqWebHost = {
    get audioMode() { return audio.mode; }, get running() { return audio.running; },
    get time() { return audio.ctx ? audio.ctx.currentTime : -1; },   // advances only while the device renders audio
    suspend() {
      audio.post({ type: 'panic' });
      toUi('notes', { on: [], off: Array.from({ length: 88 }, (_, i) => 21 + i) });
      if (audio.ctx && audio.ctx.state === 'running') audio.ctx.suspend().then(sendConfig).catch(() => {});
    },
    resume() {
      if (audio.ctx && audio.ctx.state === 'suspended') audio.ctx.resume().then(sendConfig).catch(() => {});
    },
    // the Android app: a file written by AndroidFiles.saveTextFile
    saved(name) { message(name ? `Exported ${name}` : 'Export cancelled'); },
  };

  function sendConfig() {
    const ctx = audio.ctx;
    toUi('config', { sampleRate: ctx ? ctx.sampleRate : 0, blockSize: audio.mode === 'ScriptProcessor' ? 1024 : 128, wrapper: 'Web', voices: NUM_VOICES,
                     version: RESONIQUE_VERSION, audio: ctx ? `${audio.mode || 'starting'} · ${(ctx.sampleRate / 1000).toFixed(1)} kHz` : 'click the power button to start', running: audio.running });
  }

  handlers.uiReady = () => {
    document.body.classList.add('web');
    addPageBits();
    sendConfig();
    sendPresetList();
    const first = FACTORY[0];
    if (first) { current = { id: first.id, name: first.name, category: first.category, description: first.description }; for (const id in first.values) values[id] = first.values[id]; }
    toUi('params', Object.assign({}, values));
    sendPreset();
    sendTuning();
    toUi('ir', { name: '' });
    if (query.has('selftest')) selfTest();
    if (screenshotPage) {   // a playing instrument for the store screenshots
      toUi('config', { sampleRate: 48000, blockSize: 128, wrapper: 'Web', voices: NUM_VOICES, version: RESONIQUE_VERSION, audio: 'AudioWorklet · 48.0 kHz', running: true });
      toUi('stats', { voices: 7, partials: 486, peak: 0.42, sustain: 1, sostenuto: false, soft: 0, cpu: 0.11, building: false, sampleRate: 48000 });
      toUi('notes', { on: [48, 55, 60, 64, 67], off: [] });
    }
  };

  // ?selftest: starts the audio without a click (needs a browser that allows it, e.g. headless Edge
  // with --autoplay-policy=no-user-gesture-required), plays a note and writes the outcome into the
  // page for tests/run-web-check.ps1 to read.
  async function selfTest() {
    const el = document.createElement('pre');
    el.id = 'rq-selftest';
    el.style.cssText = 'position:fixed;left:0;bottom:0;z-index:99;margin:0;padding:4px;background:#000;color:#0f0;font:12px monospace';
    document.body.appendChild(el);
    const report = (o) => { el.textContent = JSON.stringify(o); };
    try {
      let last = null, maxPeak = 0;
      window.__JUCE__.backend.addEventListener('stats', (s) => { last = s; if (s.peak > maxPeak) maxPeak = s.peak; });
      await audio.start();
      const t0 = performance.now();
      while (!audio.ready && !audio.error && performance.now() - t0 < 5000) await new Promise(r => setTimeout(r, 50));
      handlers.noteOn({ note: 60, vel: 100 });
      await new Promise(r => setTimeout(r, 1500));
      report({ ok: !!last && last.voices > 0 && maxPeak > 0.001, mode: audio.mode, ready: audio.ready, state: audio.ctx.state,
               sampleRate: audio.ctx.sampleRate, voices: last ? last.voices : -1, partials: last ? last.partials : -1, maxPeak, error: audio.error });
    } catch (e) { report({ ok: false, error: String(e && e.message || e) }); }
  }
})();

// ============================================================================
//  JUCE bridge: talks to the C++ processor through JUCE 8's native integration
//  (window.__JUCE__.backend), which JUCE injects into the page.
// ============================================================================
'use strict';

class JuceEngine {
  constructor() {
    this.backend = (window.__JUCE__ && window.__JUCE__.backend) || null;
    this.connected = !!this.backend;
    this.handlers = {};
    if (this.backend) {
      for (const ev of ['params', 'notes', 'stats', 'config', 'presetList', 'preset', 'saveResult', 'message', 'tuning', 'ir']) {
        this.backend.addEventListener(ev, (data) => { if (this.handlers[ev]) this.handlers[ev](data); });
      }
    }
  }

  on(event, fn) { this.handlers[event] = fn; }
  emit(id, payload) { if (this.backend) this.backend.emitEvent(id, payload || {}); }

  uiReady() { this.emit('uiReady'); }

  // parameters
  setParam(id, value) { this.emit('setParam', { id, value }); }
  setParams(values) { this.emit('setParams', { values }); }
  beginGesture(id) { this.emit('gesture', { id, begin: true }); }
  endGesture(id) { this.emit('gesture', { id, begin: false }); }
  paramMenu(id, x, y) { this.emit('paramMenu', { id, x: Math.round(x), y: Math.round(y) }); }

  // playing
  noteOn(note, vel) { this.emit('noteOn', { note, vel }); }
  noteOff(note) { this.emit('noteOff', { note }); }
  panic() { this.emit('panic'); }
  pedal(cc, value) { this.emit('pedal', { cc, value }); }

  // presets
  loadPreset(id) { this.emit('loadPreset', { id }); }
  savePreset(name, category, overwrite) { this.emit('savePreset', { name, category, overwrite: !!overwrite }); }
  deletePreset(id) { this.emit('deletePreset', { id }); }
  loadPresetFile() { this.emit('loadPresetFile'); }
  exportPreset() { this.emit('exportPreset'); }
  openPresetFolder() { this.emit('openPresetFolder'); }
  initPreset() { this.emit('initPreset'); }
  factoryReset() { this.emit('factoryReset'); }
  setFavourite(id, on) { this.emit('setFavourite', { id, on: !!on }); }

  // tuning
  setDetune(note, cents) { this.emit('setDetune', { note, cents }); }
  resetDetune() { this.emit('resetDetune'); }
  loadScala() { this.emit('loadScala'); }
  clearScala() { this.emit('clearScala'); }

  // impulse response
  loadIR() { this.emit('loadIR'); }
  clearIR() { this.emit('clearIR'); }
}

  <script>
// ============================================================================
//  SVG rotary knob (family widget, from E-Piano).
//  Drag up/down (Shift = fine), mouse wheel, arrow keys, double-click = default.
//  270° sweep. Bipolar params draw their arc from 12 o'clock.
// ============================================================================
'use strict';

const KNOB_SWEEP = 135; // degrees either side of 12 o'clock

function svgPolar(cx, cy, r, deg) {
  const a = (deg - 90) * Math.PI / 180;
  return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
}

function svgArc(cx, cy, r, a0, a1) {
  if (Math.abs(a1 - a0) < 0.5) return '';
  const lo = Math.min(a0, a1), hi = Math.max(a0, a1);
  const [x0, y0] = svgPolar(cx, cy, r, lo);
  const [x1, y1] = svgPolar(cx, cy, r, hi);
  const large = hi - lo > 180 ? 1 : 0;
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}

class Knob {
  // onGesture(true/false) brackets a drag so the DAW records it as one automation gesture.
  constructor(def, value, onChange, onGesture) {
    this.def = def;
    this.onChange = onChange;
    this.onGesture = onGesture || null;
    this.value = value;
    this.drag = null;

    const el = document.createElement('div');
    el.className = 'knob';
    let ticks = '';
    if (def.type === 'choice') {
      const steps = def.max - def.min;
      for (let i = 0; i <= steps; i++) {
        const [x, y] = svgPolar(32, 32, 31, -KNOB_SWEEP + (2 * KNOB_SWEEP * i) / steps);
        ticks += `<circle class="k-tick" cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="1.4"/>`;
      }
    }
    el.innerHTML = `
      <svg class="knob-svg" viewBox="0 0 64 64" tabindex="0" role="slider"
           aria-label="${def.name}" aria-valuemin="${def.min}" aria-valuemax="${def.max}">
        <path class="k-track" d="${svgArc(32, 32, 26, -KNOB_SWEEP, KNOB_SWEEP)}"/>
        ${ticks}
        <path class="k-value" d=""/>
        <circle class="k-face" cx="32" cy="32" r="19"/>
        <g class="k-rot"><line class="k-pointer" x1="32" y1="24" x2="32" y2="15"/></g>
      </svg>
      <div class="knob-value"></div>
      <div class="knob-label">${def.name}</div>`;
    this.el = el;
    this.svg = el.querySelector('svg');
    this.valuePath = el.querySelector('.k-value');
    this.rot = el.querySelector('.k-rot');
    this.readout = el.querySelector('.knob-value');
    this.bindEvents();
    this.render();
  }

  get norm() { return paramToNorm(this.def, this.value); }

  setValue(v, notify = false) {
    v = clamp(v, this.def.min, this.def.max);
    if (v === this.value) return;
    this.value = v;
    this.render();
    if (notify && this.onChange) this.onChange(v);
  }

  setNorm(n) { this.setValue(paramFromNorm(this.def, n), true); }

  nudge(dir, fine) {
    const d = this.def;
    if (d.step) this.setValue(this.value + dir * d.step, true);
    else this.setNorm(this.norm + dir * (fine ? 0.002 : 0.01));
  }

  render() {
    const d = this.def;
    const angle = -KNOB_SWEEP + this.norm * 2 * KNOB_SWEEP;
    const startAngle = d.bipolar ? 0 : -KNOB_SWEEP;
    this.valuePath.setAttribute('d', svgArc(32, 32, 26, startAngle, angle));
    this.rot.setAttribute('transform', `rotate(${angle.toFixed(2)} 32 32)`);
    this.readout.textContent = formatParam(d, this.value);
    this.svg.setAttribute('aria-valuenow', String(this.value));
    this.svg.setAttribute('aria-valuetext', formatParam(d, this.value));
  }

  bindEvents() {
    const svg = this.svg;
    svg.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      svg.setPointerCapture(e.pointerId);
      svg.focus();
      this.drag = { y: e.clientY, norm: this.norm };
      this.el.classList.add('active');
      if (this.onGesture) this.onGesture(true);
    });
    svg.addEventListener('pointermove', (e) => {
      if (!this.drag) return;
      const dy = this.drag.y - e.clientY;
      this.drag.y = e.clientY;
      this.drag.norm = clamp(this.drag.norm + dy * (e.shiftKey || e.ctrlKey ? 0.001 : 0.005), 0, 1);
      this.setNorm(this.drag.norm);
    });
    const end = () => {
      if (!this.drag) return;
      this.drag = null;
      this.el.classList.remove('active');
      if (this.onGesture) this.onGesture(false);
    };
    svg.addEventListener('pointerup', end);
    svg.addEventListener('pointercancel', end);
    svg.addEventListener('dblclick', () => this.setValue(this.def.def, true));
    svg.addEventListener('wheel', (e) => {
      e.preventDefault();
      this.nudge(e.deltaY < 0 ? 1 : -1, e.shiftKey);
    }, { passive: false });
    svg.addEventListener('keydown', (e) => {
      const dir = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
      if (dir) { e.preventDefault(); e.stopPropagation(); this.nudge(dir, e.shiftKey); }
    });
  }
}

  <script>
// ============================================================================
//  Parameter controls besides the knob (family widgets). Same conventions:
//  setValue(v) updates the display, onChange(v) fires on user edits.
//    ToggleButton - bool param   (click; double-click = default)
//    Segmented    - choice param (click; wheel / arrow keys step; double-click = default)
//    SelectBox    - choice param (native dropdown; wheel steps; double-click = default)
//    PedalButton  - a latching pedal (not a parameter): click toggles, sends a CC
// ============================================================================
'use strict';

class ToggleButton {
  constructor(def, value, onChange, label) {
    this.def = def;
    this.onChange = onChange;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'power';
    b.innerHTML = `<span class="led"></span><span>${label || 'ON'}</span>`;
    b.addEventListener('click', () => this.onChange(this.value >= 0.5 ? 0 : 1));
    this.el = b;
    this.setValue(value);
  }
  setValue(v) {
    this.value = v;
    this.el.classList.toggle('on', v >= 0.5);
    this.el.setAttribute('aria-pressed', v >= 0.5);
  }
}

class Segmented {
  constructor(def, value, onChange, labels) {
    this.def = def;
    this.onChange = onChange;
    const wrap = document.createElement('div');
    wrap.className = 'seg';
    wrap.setAttribute('role', 'radiogroup');
    wrap.setAttribute('aria-label', def.name);
    this.buttons = (labels || def.choices).map((label, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = label;
      b.setAttribute('role', 'radio');
      b.addEventListener('click', () => this.pick(i));
      wrap.appendChild(b);
      return b;
    });
    wrap.addEventListener('wheel', (e) => { e.preventDefault(); this.pick(this.value + (e.deltaY < 0 ? 1 : -1)); }, { passive: false });
    wrap.addEventListener('keydown', (e) => {
      const dir = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
      if (dir) { e.preventDefault(); e.stopPropagation(); this.pick(this.value + dir); this.buttons[this.value].focus(); }
    });
    wrap.addEventListener('dblclick', () => this.pick(this.def.def));
    this.el = wrap;
    this.setValue(value);
  }
  pick(i) {
    i = clamp(Math.round(i), 0, this.buttons.length - 1);
    if (i !== this.value) this.onChange(i);
  }
  setValue(v) {
    this.value = clamp(Math.round(v), 0, this.buttons.length - 1);
    this.buttons.forEach((b, i) => { b.classList.toggle('on', i === this.value); b.setAttribute('aria-checked', i === this.value); });
  }
}

class SelectBox {
  constructor(def, value, onChange, labels) {
    this.def = def;
    this.onChange = onChange;
    const s = document.createElement('select');
    s.className = 'param-select';
    s.setAttribute('aria-label', def.name);
    (labels || def.choices).forEach((label, i) => s.appendChild(new Option(label, String(i))));
    s.addEventListener('change', () => this.onChange(Number(s.value)));

      e.preventDefault();
      const i = clamp(this.value + (e.deltaY < 0 ? -1 : 1), 0, s.options.length - 1);
      if (i !== this.value) this.onChange(i);
    }, { passive: false });
    s.addEventListener('dblclick', () => { if (this.value !== this.def.def) this.onChange(this.def.def); });
    s.addEventListener('keydown', (e) => e.stopPropagation()); // arrow keys belong to the dropdown, not the piano
    this.el = s;
    this.setValue(value);
  }
  setValue(v) {
    this.value = clamp(Math.round(v), 0, this.el.options.length - 1);
    this.el.value = String(this.value);
  }
}

class PedalButton {
  // cc: 64 sustain, 66 sostenuto, 67 soft. Click latches; the plugin reports the state back.
  constructor(label, cc, onChange) {
    this.cc = cc;
    this.onChange = onChange;
    this.value = 0;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'pedal-btn';
    b.innerHTML = `<span class="pedal-shoe"></span><span class="pedal-label">${label}</span>`;
    b.addEventListener('click', () => this.onChange(this.cc, this.value >= 0.5 ? 0 : 127));
    this.el = b;
  }
  setValue(v) {
    this.value = v;
    this.el.classList.toggle('on', v >= 0.5);
    this.el.classList.toggle('half', v > 0.05 && v < 0.5);
  }
}
