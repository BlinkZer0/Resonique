plugins {
    id 'com.android.application'
}

// Release signing: copy keystore.properties.example to keystore.properties (git-ignored).
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) keystorePropsFile.withInputStream { keystoreProps.load(it) }

// The app's version name follows the plugin's (vst/CMakeLists.txt: project(... VERSION x.y.z)).
def cmake = rootProject.file('../vst/CMakeLists.txt').getText('UTF-8')
def pluginVersion = (cmake =~ /project\(ResoniqueVST VERSION ([0-9.]+)/)[0][1]

android {
    namespace 'com.blinkzer0.resonique'
    compileSdk 36

    defaultConfig {
        applicationId 'com.blinkzer0.resonique'   // permanent once published on Play
        minSdk 26
        targetSdk 36
        versionCode 1                             // bump for every Play upload
        versionName pluginVersion
    }

    signingConfigs {
        if (keystorePropsFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}

// ---------------------------------------------------------------------------
// Bundle the web build (../web/index.html, generated by vst/webhost/build-web.ps1)
// into the app, with the Web MIDI shim loaded first in <head>.
// ---------------------------------------------------------------------------
abstract class BundleWebApp extends DefaultTask {
    @InputFile abstract RegularFileProperty getWebIndex()
    @OutputDirectory abstract DirectoryProperty getOutputDir()

    @TaskAction
    void run() {
        String html = webIndex.get().asFile.getText('UTF-8')
        int i = html.indexOf('<head>')
        if (i < 0) throw new GradleException('web/index.html has no <head> tag')
        if (!html.contains('synthWorkletModule')) throw new GradleException('web/index.html has no engine: run vst/webhost/build-web.ps1')
        i += '<head>'.length()
        html = html.substring(0, i) + '\n<script src="android-midi.js"></script>' + html.substring(i)
        File out = outputDir.get().asFile
        out.mkdirs()
        new File(out, 'index.html').setText(html, 'UTF-8')
    }
}

def bundleWebApp = tasks.register('bundleWebApp', BundleWebApp) {
    webIndex = rootProject.file('../web/index.html')
    outputDir = layout.buildDirectory.dir('generated/webapp')
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets?.addGeneratedSourceDirectory(bundleWebApp, { it.outputDir })
    }
}
