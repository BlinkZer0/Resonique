<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resonique</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="plugin">
  <!-- shared SVG defs: knob face gradient + the logo -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <radialGradient id="knobFace" cx="38%" cy="30%" r="80%">
        <stop offset="0%" stop-color="#3d3a40"/>
        <stop offset="60%" stop-color="#1f1c22"/>
        <stop offset="100%" stop-color="#121014"/>
      </radialGradient>
      <symbol id="logo" viewBox="0 0 40 40">
        <rect x="1.5" y="1.5" width="37" height="37" rx="8" fill="#1a171a" stroke="#3a343b"/>
        <path d="M8 19 a12 12 0 0 1 24 0" fill="none" stroke="#efe6d2" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M12 19 a8 8 0 0 1 16 0" fill="none" stroke="#efe6d2" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
        <path d="M16 19 a4 4 0 0 1 8 0" fill="none" stroke="#efe6d2" stroke-width="1.6" stroke-linecap="round" opacity="0.45"/>
        <circle cx="20" cy="19" r="2.2" fill="#d9544a"/>
        <rect x="6" y="25" width="28" height="2" fill="#d9544a"/>
        <rect x="6" y="27" width="28" height="8" fill="#0d0c0e"/>
        <rect x="10" y="27" width="3" height="5" fill="#efe6d2"/><rect x="15" y="27" width="3" height="5" fill="#efe6d2"/>
        <rect x="23" y="27" width="3" height="5" fill="#efe6d2"/><rect x="28" y="27" width="3" height="5" fill="#efe6d2"/>
      </symbol>
    </defs>
  </svg>

  <main class="synth">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-logo" aria-hidden="true"><use href="#logo"/></svg>
        <div class="brand-text">
          <span class="brand-mark">RESONIQUE</span>
          <span class="brand-sub" id="brand-sub">PHYSICAL PIANO</span>
        </div>
      </div>
      <div class="patch-display">
        <button id="preset-prev" type="button" class="pd-step" aria-label="Previous preset">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M8 2 4 6l4 4"/></svg>
        </button>
        <div class="pd-text">
          <span id="preset-cat" class="pd-label">PRESET</span>
          <span id="preset-name" class="pd-name"></span>
        </div>
        <button id="preset-fav" type="button" class="pd-fav" title="Favourite">&#9733;</button>
        <button id="preset-next" type="button" class="pd-step" aria-label="Next preset">
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m4 2 4 4-4 4"/></svg>
        </button>
      </div>
      <div class="preset-actions">
        <button id="preset-save" type="button" class="pd-btn">SAVE</button>
        <button id="preset-load" type="button" class="pd-btn" title="Load a .rqpreset file">IMPORT</button>
        <button id="preset-export" type="button" class="pd-btn" title="Export the current sound as a .rqpreset file">EXPORT</button>
        <button id="preset-folder" type="button" class="pd-btn" title="Open the preset folder">FOLDER</button>
        <button id="preset-init" type="button" class="pd-btn" title="Every parameter to its default">INIT</button>
      </div>
      <div class="top-controls">
        <span class="indicator"><span class="led" id="midi-led" title="Note activity"></span>MIDI</span>
        <span class="indicator"><span class="led" id="sustain-led"></span>SUS</span>
        <span class="indicator"><span class="led" id="sost-led"></span>SOST</span>
        <span class="indicator"><span class="led" id="soft-led"></span>SOFT</span>
        <button id="panic-btn" type="button" class="panic">PANIC</button>
      </div>
    </header>

    <section class="browser" aria-label="Presets">
      <div class="browser-head">
        <div class="cat-tabs" id="cat-tabs" role="tablist"></div>
        <input id="preset-search" type="search" placeholder="Search presets…" spellcheck="false" autocomplete="off">
      </div>
      <div class="preset-grid" id="preset-grid"></div>
      <div class="preset-desc" id="preset-desc"></div>
    </section>

    <nav class="page-tabs" role="tablist" aria-label="Sections">
      <button type="button" class="page-tab" data-page="main" role="tab">MAIN</button>
      <button type="button" class="page-tab" data-page="physics" role="tab">PHYSICAL MODEL</button>
      <button type="button" class="page-tab" data-page="mics" role="tab">MICROPHONES</button>
      <button type="button" class="page-tab" data-page="perf" role="tab">PERFORMANCE</button>
      <button type="button" class="page-tab" data-page="tuning" role="tab">TUNING</button>
      <span class="page-hint" id="page-hint"></span>
    </nav>
    <div class="pages">
      <div class="page" data-page="main"><section class="row row-main" id="main-row"></section></div>
      <div class="page" data-page="physics"><section class="row row-physics" id="physics-row"></section></div>
      <div class="page" data-page="mics"><section class="row row-mics" id="mics-row"></section></div>
      <div class="page" data-page="perf"><section class="row row-perf" id="perf-row"></section></div>
      <div class="page" data-page="tuning"><section class="row row-tuning" id="tuning-row"></section></div>
    </div>

    <section class="keybed">
      <div class="pedals" id="pedals">
        <span class="kbd-hint">Keys A–' play · Z / X octave</span>
      </div>
      <!-- phones (compact layout) show part of the keyboard: shift it by octaves -->
      <div class="octave-ctl" id="octave-ctl">
        <div class="oct-buttons">
          <button id="oct-down" type="button" aria-label="Octave down">&#8722;</button>
          <button id="oct-up" type="button" aria-label="Octave up">+</button>
        </div>
        <span id="octave-readout" class="oct-readout"></span>
      </div>
      <div id="piano" class="piano"></div>
    </section>

    <footer class="statusbar">
      <span id="midi-monitor" class="monitor">Connecting to plugin…</span>
      <span class="audio-status"><span class="led" id="audio-led"></span><span id="audio-info">—</span></span>
    </footer>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <div id="modal-title" class="modal-title"></div>
      <div id="modal-body" class="modal-body"></div>
      <input id="modal-input" class="modal-input" type="text" maxlength="60" spellcheck="false" autocomplete="off">
      <div id="modal-label2" class="modal-label"></div>
      <input id="modal-input2" class="modal-input" type="text" maxlength="40" spellcheck="false" autocomplete="off">
      <div class="modal-actions">
        <button id="modal-cancel" type="button" class="pd-btn">CANCEL</button>
        <button id="modal-ok" type="button" class="pd-btn primary">OK</button>
      </div>
    </div>
  </div>

  <script src="js/params.js"></script>
  <script src="js/engine-juce.js"></script>
  <script src="js/knob.js"></script>
  <script src="js/controls.js"></script>
  <script src="js/piano.js"></script>
  <script src="js/editors.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
